name: CI

on:
  push:
    branches: [main, feature/hybrid-auto-remove]
  pull_request:
    branches: [main, feature/hybrid-auto-remove]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify Feral-compatible urllib3
        run: python -c "import urllib3; assert urllib3.__version__.startswith('1.'), urllib3.__version__; print('urllib3', urllib3.__version__)"
      - name: Compile
        run: python -m compileall -q src tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell syntax
        run: |
          bash -n install.sh
          bash -n uninstall.sh
